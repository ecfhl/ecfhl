name: Archive checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: find app routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/archive-smoke.php
