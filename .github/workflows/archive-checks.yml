name: Archive checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, dom
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: php tests/messaging.php
      - run: node tests/live-score-updates.cjs
      - run: node tests/mobile-swipes.cjs
      - run: find app routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - if: ${{ !cancelled() }}
        run: php tests/archive-smoke.php
      - if: ${{ !cancelled() }}
        run: php tests/ai-tips.php
      - if: ${{ !cancelled() }}
        run: php tests/starting-goalies.php
      - if: ${{ !cancelled() }}
        run: php tests/live-scoring.php
      - if: ${{ !cancelled() }}
        run: php tests/home.php
      - if: ${{ !cancelled() }}
        run: node tests/overview-layout.cjs
      - if: ${{ !cancelled() }}
        run: php tests/season-players.php
      - if: ${{ !cancelled() }}
        run: node tests/season-players-ui.cjs
      - if: ${{ !cancelled() }}
        run: node tests/season-players-filters.cjs
      - if: ${{ !cancelled() }}
        run: php tests/standings-collector.php
      - if: ${{ !cancelled() }}
        run: node tests/live-scoring-ui.cjs
      - if: ${{ !cancelled() }}
        run: node tests/standings-ui.cjs
      - if: ${{ !cancelled() }}
        run: php tests/drafts-only.php
      - if: ${{ !cancelled() }}
        run: php tests/owner-accounts.php
      - if: ${{ !cancelled() }}
        run: php tests/performance.php
      - if: ${{ !cancelled() }}
        run: php tests/site-audit.php
      - if: ${{ !cancelled() }}
        run: php tests/standings.php
      - if: ${{ !cancelled() }}
        run: php tests/player-projections.php
      - if: ${{ !cancelled() }}
        run: node tests/goalie-watches-ui.cjs
  compact-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, dom
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: mkdir -p storage/app
      - run: php tests/messaging.php --browser-page
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/chat-content.cjs
      - run: node tests/chat-compact.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: compact-chat-preview
          path: storage/app/compact-chat-preview.png
