name: Archive checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, dom
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: find app routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/archive-smoke.php
      - run: php tests/ai-tips.php
      - run: php tests/starting-goalies.php
      - run: php tests/live-scoring.php
      - run: php tests/home.php
      - run: node tests/overview-layout.cjs
      - run: php tests/season-players.php
      - run: php tests/standings-collector.php
      - run: node tests/live-scoring-ui.cjs
      - run: node tests/standings-ui.cjs
