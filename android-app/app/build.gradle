plugins {
    id 'com.android.application'
}

android {
    namespace 'win.ecfhl.dailytargets'
    compileSdk 35

    defaultConfig {
        applicationId "win.ecfhl.dailytargets"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
