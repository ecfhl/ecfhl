let positionFilter='ALL',ppFilter='ALL',rookiesOnly=false,sortKey='rk',sortDir=1;let customOrder=JSON.parse(localStorage.getItem('ecfhl-rank-order')||'null');if(customOrder){const idx=new Map(customOrder.map((id,i)=>[id,i]));players.sort((a,b)=>(idx.has(a.id)?idx.get(a.id):999999)-(idx.has(b.id)?idx.get(b.id):999999));players.forEach((p,i)=>p.rk=i+1)}let drafted=new Set(JSON.parse(localStorage.getItem('ecfhl-drafted')||'[]'));
function setPosition(v){positionFilter=v;posAllBtn.classList.toggle('active',v==='ALL');fBtn.classList.toggle('active',v==='F');dBtn.classList.toggle('active',v==='D');render()}function toggleRookies(){rookiesOnly=!rookiesOnly;rookieBtn.classList.toggle('active',rookiesOnly);render()}function setPP(v){ppFilter=v;['ALL','PP1','PP2'].forEach(x=>document.getElementById(x==='ALL'?'ppAllBtn':x.toLowerCase()+'Btn').classList.toggle('active',x===v));render()}function setDrafted(id,checked){checked?drafted.add(id):drafted.delete(id);localStorage.setItem('ecfhl-drafted',JSON.stringify([...drafted]));render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sortBy(key){if(sortKey===key)sortDir*=-1;else{sortKey=key;sortDir=1}document.querySelectorAll('th[data-key]').forEach(th=>{th.classList.remove('sort-asc','sort-desc');if(th.dataset.key===sortKey)th.classList.add(sortDir===1?'sort-asc':'sort-desc')});render()}document.querySelectorAll('th[data-key]').forEach(th=>th.addEventListener('click',()=>sortBy(th.dataset.key)));let draggedId=null;function saveRankOrder(){const ranked=[...players].sort((a,b)=>(a.rk??999999)-(b.rk??999999));localStorage.setItem('ecfhl-rank-order',JSON.stringify(ranked.map(p=>p.id)))}function movePlayer(dragId,targetId,after=false){if(dragId===targetId)return;let ranked=[...players].sort((a,b)=>(a.rk??999999)-(b.rk??999999));const from=ranked.findIndex(p=>p.id===dragId);const[item]=ranked.splice(from,1);let to=ranked.findIndex(p=>p.id===targetId);if(after)to++;ranked.splice(to,0,item);ranked.forEach((p,i)=>p.rk=i+1);players.splice(0,players.length,...ranked);sortKey='rk';sortDir=1;saveRankOrder();render()}function wireDrag(){document.querySelectorAll('#body tr[draggable=true]').forEach(tr=>{tr.addEventListener('dragstart',e=>{draggedId=Number(tr.dataset.id);tr.classList.add('dragging');e.dataTransfer.effectAllowed='move'});tr.addEventListener('dragend',()=>{draggedId=null; function render(){const q=search.value.toLowerCase().trim(),hide=hideDrafted.checked;let rows=players.filter(p=>(positionFilter==='ALL'||p.position===positionFilter)&&(ppFilter==='ALL'||p.pp===ppFilter)&&(!rookiesOnly||p.rookie)&&(!q||(p.player+' '+p.team).toLowerCase().includes(q))&&(!hide||!drafted.has(p.id)));if(sortKey)rows.sort((a,b)=>{let av=sortKey==='drafted'?(drafted.has(a.id)?1:0):a[sortKey],bv=sortKey==='drafted'?(drafted.has(b.id)?1:0):b[sortKey];if(av==null||av==='')return 1;if(bv==null||bv==='')return-1;if(typeof av==='string')return av.localeCompare(bv,undefined,{numeric:true,sensitivity:'base'})*sortDir;return(av-bv)*sortDir});meta.textContent=`${rows.length} shown · ${drafted.size} drafted`;body.innerHTML=rows.map(p=>`<tr draggable="true" data-id="${p.id}" class="${drafted.has(p.id)?'drafted':'pos-'+p.position.toLowerCase()}"><td class="draghandle">☰</td><td><input type="checkbox" ${drafted.has(p.id)?'checked':''} onchange="setDrafted(${p.id},this.checked)"></td><td><span class="player">${esc(p.player)}</span></td><td>${esc(p.team)}</td><td class="pos">${esc(p.position)}</td><td>${p.rookie?'<span class="badge rookie">R</span>':''}</td><td class="num">${p.age??''}</td><td><span class="badge ${p.pp==='PP1'?'pp1':p.pp==='PP2'?'pp2':'not'}">${esc(p.pp)}</span></td><td class="num">${p.rk??''}</td><td class="num">${Math.round(p.projected)}</td><td class="num">${p.fpg.toFixed(2)}</td></tr>`).join('');wireDrag()}document.querySelector('th[data-key="rk"]')?.classList.add('sort-asc');render();
